name: Create iso.yml
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Araclari kur
        run: sudo apt-get update && sudo apt-get install -y genisoimage unzip

      - name: Zipi ac
        run: |
          rm -rf isodosyalari
          mkdir isodosyalari
          unzip -q minios-os.zip -d isodosyalari
          ls -R isodosyalari

      - name: ISO yap
        run: genisoimage -o MiniOS.iso -V MiniOS -R -J -l isodosyalari

      - name: Kaydet
        uses: actions/upload-artifact@v4
        with:
          name: MiniOS-ISO
          path: MiniOS.iso
