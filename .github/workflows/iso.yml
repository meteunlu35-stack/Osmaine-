name: Create iso.yml
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y genisoimage unzip
      - run: rm -rf isodosyalari && mkdir isodosyalari && unzip -q minios-os.zip -d isodosyalari
      - run: genisoimage -o MiniOS.iso -V MiniOS -R -J isodosyalari
      - uses: actions/upload-artifact@v4
        with:
          name: MiniOS-ISO
          path: MiniOS.iso
